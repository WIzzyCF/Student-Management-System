<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Student Registry</h1>
    <p class="count"><strong id="count">0</strong> <span id="count-label">students registered</span></p>
  </header>

  <main class="layout">
    <section class="panel form-panel" aria-labelledby="form-title">
      <h2 id="form-title">Register a student</h2>
      <form id="student-form" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input id="name" type="text" maxlength="80" autocomplete="off" placeholder="e.g. Ada Okafor" aria-describedby="name-error">
          <small class="error" id="name-error"></small>
        </div>
        <div class="row">
          <div class="field">
            <label for="matric">Matric number</label>
            <input id="matric" type="text" maxlength="30" autocomplete="off" placeholder="e.g. 20/CS/041" aria-describedby="matric-error">
            <small class="error" id="matric-error"></small>
          </div>
          <div class="field">
            <label for="level">Level</label>
            <select id="level" aria-describedby="level-error">
              <option value="">Select</option>
              <option>100</option><option>200</option><option>300</option><option>400</option><option>500</option>
            </select>
            <small class="error" id="level-error"></small>
          </div>
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" type="email" maxlength="100" autocomplete="off" placeholder="name@example.com" aria-describedby="email-error">
          <small class="error" id="email-error"></small>
        </div>
        <div class="field">
          <label for="phone">Phone number</label>
          <input id="phone" type="tel" maxlength="20" autocomplete="off" placeholder="e.g. 08012345678" aria-describedby="phone-error">
          <small class="error" id="phone-error"></small>
        </div>
        <div class="field">
          <label for="department">Department</label>
          <input id="department" type="text" maxlength="60" autocomplete="off" placeholder="e.g. Software Engineering" aria-describedby="department-error">
          <small class="error" id="department-error"></small>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn" id="submit-btn">Register student</button>
          <button type="button" class="btn ghost" id="cancel-btn" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <section class="panel" aria-labelledby="list-title">
      <div class="toolbar">
        <h2 id="list-title">Registered students</h2>
        <input class="search" id="search" type="search" placeholder="Search name, matric number, email…" aria-label="Search students">
      </div>
      <p id="result-info" role="status"></p>
      <div class="table-wrap" id="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th><th>Matric no.</th><th>Email</th><th>Phone</th><th>Department</th><th>Level</th>
              <th><span class="sr">Actions</span></th>
            </tr>
          </thead>
          <tbody id="student-list"></tbody>
        </table>
      </div>
      <p class="empty" id="empty" hidden></p>
    </section>
  </main>

  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <h3 id="confirm-title">Delete this student?</h3>
    <p id="confirm-text"></p>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" id="confirm-cancel">Keep student</button>
      <button type="button" class="btn danger-solid" id="confirm-delete">Delete student</button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
